   # Озвучка экзаменов: при загрузке нового audio_clips.json GitHub сам создаёт mp3 в папке audio/
   name: Озвучка экзаменов
   on:
     push:
       paths: ["audio_clips.json", "make_audio.py"]
     workflow_dispatch:
   permissions:
     contents: write
   jobs:
     audio:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-python@v5
           with:
             python-version: "3.11"
         - run: sudo apt-get install -y -qq ffmpeg && pip install -q edge-tts
         - run: python make_audio.py
         - name: Сохранить mp3
           run: |
             git config user.name "audio-bot"
             git config user.email "audio-bot@users.noreply.github.com"
             git add audio
             git diff --cached --quiet || git commit -m "Озвучка экзаменов"
             git push
